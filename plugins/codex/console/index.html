<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Loop 本机管理面板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">AI LOOP · CODEX</p>
      <h1>本机管理面板</h1>
      <p class="intro">在这里设置后续调度使用的角色模型和工作区。配置在原生配置下一次重载后生效，不改变当前主会话。</p>
    </header>
    <section class="card">
      <div class="section-title"><div><h2>工作区</h2><p>只有登记并启用的目录会由工作流入口使用。</p></div></div>
      <div class="row register"><label for="new-root">登记准确目录</label><input id="new-root" type="text" placeholder="例如 D:\Projects\my-app"><button id="register">登记目录</button></div>
      <div class="row"><label for="workspace">当前工作区</label><select id="workspace"></select><label class="toggle"><input id="enabled" type="checkbox"><span>工作流启用</span></label></div>
      <p id="workspace-note" class="muted"></p>
    </section>
    <section class="card">
      <div class="section-title"><div><h2>模型与并发</h2><p>模型清单来自 Codex 本机原生服务的只读查询。</p></div><button id="refresh" class="quiet">重新读取</button></div>
      <div class="row scope-row"><label for="scope">配置范围</label><select id="scope"><option value="global">全局默认</option><option value="project">当前工作区覆盖</option></select><button id="reset" class="quiet">恢复项目默认</button></div>
      <p id="models-note" class="muted"></p>
      <div id="roles" class="roles"></div>
      <div class="row concurrency"><label for="concurrency">并发上限（1–8）</label><input id="concurrency" type="number" min="1" max="8"></div>
      <button id="save" class="primary">保存配置</button>
      <p id="status" role="status" class="status"></p>
    </section>
    <footer>仅在本机 127.0.0.1 提供服务。面板不会写入 settings.json 或 Codex 信任设置。<button id="shutdown" class="quiet">关闭管理服务</button></footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
