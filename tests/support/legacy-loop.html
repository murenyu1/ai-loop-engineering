<!doctype html><script>
// Minimal historical failure path from 07adf7a: a new instance reads via the render
// tool, then emits a model message. The offline host intercepts both effects.
const pending = new Map();
let id = 0, locating = false;
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  const item = pending.get(event.data?.id);
  if (!item) return;
  pending.delete(event.data.id);
  clearTimeout(item.timer);
  event.data.error ? item.reject(Error(event.data.error.message)) : item.resolve(event.data.result);
});
function request(method, params = {}) {
  return new Promise((resolve, reject) => {
    const key = ++id;
    const timer = setTimeout(() => { pending.delete(key); reject(Error('timeout')); }, 10000);
    pending.set(key, { resolve, reject, timer });
    window.parent.postMessage({ jsonrpc: '2.0', id: key, method, params }, '*');
  });
}
async function start() {
  try {
    await request('ui/initialize');
    await request('tools/call', { name: 'ai_loop.dashboard', arguments: {} });
    if (locating) return;
    locating = true;
    await request('tools/call', { name: 'ai_loop.dashboard', arguments: { binding: 'legacy-panel-' + Math.random().toString(36).slice(2) } });
    await request('ui/message', { role: 'user', content: [{ type: 'text', text: '历史故障定位请求（仅离线捕获）' }] });
  } catch {}
}
start();
</script>
