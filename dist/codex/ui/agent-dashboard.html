<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Loop 代理看板</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:20px;color:CanvasText;background:Canvas}h1{font-size:19px;margin:0 0 6px}p{color:GrayText;margin:4px 0 16px}label{display:block;margin:12px 0 4px}select,button{font:inherit;color:CanvasText;background:Canvas;border:1px solid GrayText;border-radius:6px;padding:7px;max-width:100%}button{cursor:pointer;margin:12px 0}.agent{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:8px;padding:12px;margin:8px 0}.muted{color:GrayText}.pill{font-size:12px;border:1px solid GrayText;border-radius:20px;padding:2px 8px;float:right}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>AI Loop 代理看板</h1>
<p id="note">选择已登记工作区和运行记录，查看本地观察与任务状态。此看板只读，不调用模型。</p>
<label for="workspace">工作区</label><select id="workspace"><option value="">读取中…</option></select>
<label for="run">运行</label><select id="run"><option value="">先选择工作区</option></select>
<nav aria-label="看板视图"><button data-view="agents">代理</button><button data-view="tasks">任务</button><button data-view="activity">活动记录</button><button id="refresh" type="button">刷新</button></nav>
<section id="view" aria-live="polite"><p class="muted">等待看板数据…</p></section>
<script>
const $=id=>document.getElementById(id), app=window.openai, pending=new Map();let rpcId=1,payload=null,activeView='agents',workspacesLoaded=false,runsRequestId=0,statusRequestId=0;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function structured(result){const value=result?.result??result;if(value?.isError)throw Error((value.content??[]).filter(item=>item.type==='text').map(item=>item.text).join('\n')||'看板工具返回错误');return value?.structuredContent??value;}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;if(message.id&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);message.error?item.reject(Error(message.error.message??'MCP App 请求失败')):item.resolve(message.result);return}if(message.method==='ui/notifications/tool-result'){let value;try{value=structured(message.params);}catch(error){$('note').textContent=error.message;return;}if(value?.workspaces&&!workspacesLoaded)fillWorkspaces(value.workspaces);}});
function request(method,params={}){const id=rpcId++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('MCP App 宿主响应超时'));},10000);pending.set(id,{resolve:value=>{clearTimeout(timer);resolve(value);},reject:error=>{clearTimeout(timer);reject(error);}});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
async function call(name,args={}){try{return structured(await request('tools/call',{name,arguments:args}));}catch(error){if(app?.callTool)return structured(await app.callTool(name,args));throw error;}}
function fillWorkspaces(workspaces){workspacesLoaded=true;$('workspace').innerHTML='<option value="">选择已登记工作区</option>'+workspaces.map(item=>`<option value="${esc(item.root)}">${esc(item.root)}${item.enabled?' · 已启用':' · 已停用'}</option>`).join('');if(!workspaces.length)$('note').textContent='尚无已登记工作区。请先在插件设置中选择工作区并应用。';}
function render(data){
  payload=data;
  const agents=data?.activity?.agents??[],tasks=data?.run?.tasks??[],log=data?.events??[];
  $('note').textContent=(data?.activity?.note??'观察仅代表最后一次记录。')+` 运行状态：${data?.run?.status??'未知'}。`;
  if(activeView==='tasks'){
    $('view').innerHTML=tasks.length?tasks.map(task=>`<article class="agent"><span class="pill">${esc(task.phase??'未知阶段')}</span><strong>${esc(task.title??task.id)}</strong><p>任务 ${esc(task.id)} · 负责人 ${esc(task.owner??'未指定')} · 验证 ${esc(task.verification?.status??'待核验')} · 评审 ${esc(task.assessment?.status??'待复核')}</p><p>${esc(task.reason??task.blocked_reason??(task.ready?'依赖已满足，可以进入开发':'暂无任务摘要'))}</p></article>`).join(''):'<p class="muted">此运行没有任务数据。</p>';
    return;
  }
  if(activeView==='activity'){
    $('view').innerHTML=log.length?log.slice().reverse().map(item=>`<article class="agent"><span class="pill">#${esc(item.seq)}</span><strong>${esc(item.type??'event')}</strong><p>${esc(item.summary??item.reason??JSON.stringify(item))}</p><p class="muted">${esc(item.time??'时间未记录')} · ${esc(item.task_id??'')}</p></article>`).join(''):'<p class="muted">此运行没有活动事件。</p>';
    return;
  }
  const disabled=Object.entries(data?.roles??{}).filter(([,role])=>!role.enabled).map(([name])=>`<article class="agent muted"><strong>${esc(name)}</strong><span class="pill">已关闭</span><p>不创建新子代理；必要工作由主代理承担。</p></article>`).join('');
  const rows=agents.map(agent=>`<article class="agent"><span class="pill">${esc(agent.state??'unknown')}</span><strong>${esc(agent.role??'未知角色')}</strong> · ${esc(agent.harness??'未知宿主')}<p>${esc(agent.summary??agent.observation?.summary??'暂无摘要')}</p><p>原生 ID：${esc(agent.native_id??'尚未获取')}</p><p class="muted">任务：${esc(agent.task??'—')} · 请求模型：${esc(agent.requested?.model??'未记录')} · 观测模型：${esc(agent.effective_model??'unverified')}</p><p class="muted">Token 输入/输出：${agent.usage?`${esc(agent.usage.input_tokens??'不可获取')} / ${esc(agent.usage.output_tokens??'不可获取')}`:'不可获取'} · 最近观察：${esc(agent.updated_at??'未知')} · ${agent.stale?'观察可能已过期':'仅最后观察'}</p></article>`).join('');
  $('view').innerHTML=rows+disabled||'<p class="muted">此运行尚无代理观察记录。</p>';
}
async function loadRuns(){const root=$('workspace').value,requestId=++runsRequestId;++statusRequestId;payload=null;$('view').innerHTML='<p class="muted">请选择运行以读取观察。</p>';$('run').value='';$('run').innerHTML='<option value="">读取中…</option>';if(!root)return;try{const result=await call('ai_loop.dashboard.runs',{root});if(requestId!==runsRequestId||root!==$('workspace').value)return;$('run').innerHTML='<option value="">选择运行</option>'+((result.runs??[]).map(run=>`<option value="${esc(run.run_id)}">${esc(run.project_path??".")} / ${esc(run.run_id)} · ${esc(run.status)} · ${esc(run.goal??'')}</option>`).join(''));}catch(error){if(requestId!==runsRequestId||root!==$('workspace').value)return;$('run').innerHTML='<option value="">读取失败</option>';$('note').textContent=error.message;}}
async function refresh(){const root=$('workspace').value,run=$('run').value,requestId=++statusRequestId;if(!root||!run){payload=null;$('view').innerHTML='<p class="muted">请选择工作区和运行。</p>';return}payload=null;$('view').innerHTML='<p class="muted">正在读取最近观察…</p>';try{const result=await call('ai_loop.dashboard.status',{root,run});if(requestId!==statusRequestId||root!==$('workspace').value||run!==$('run').value)return;render(result);}catch(error){if(requestId!==statusRequestId||root!==$('workspace').value||run!==$('run').value)return;$('view').innerHTML=`<p>${esc(error.message)}</p>`;}}
async function init(){try{let connected=false;try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'AI Loop 代理看板',version:'4.5.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});connected=true;}catch(error){if(!app?.callTool)throw error;}$('note').textContent=connected?'选择已登记工作区查看本地观察。':'使用兼容的 Codex App 工具桥接。';if(connected)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(app?.toolOutput){const initial=structured(app.toolOutput);if(initial?.workspaces)fillWorkspaces(initial.workspaces);}if(!workspacesLoaded)fillWorkspaces((await call('ai_loop.dashboard')).workspaces);}catch(error){$('note').textContent=error.message;}}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{activeView=button.dataset.view;if(payload)render(payload);}));$('workspace').addEventListener('change',loadRuns);$('run').addEventListener('change',refresh);$('refresh').addEventListener('click',refresh);init();
</script>
</body>
</html>
