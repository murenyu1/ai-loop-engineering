<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Loop 代理看板</title><style>
:root{color-scheme:light dark;font:14px/1.6 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;color:CanvasText;background:Canvas}h1{font-size:21px;margin:0}p{margin:6px 0 14px}.muted,#note,#scope{color:GrayText}label{display:block;margin-top:10px}select,button{font:inherit;color:CanvasText;background:Canvas;border:1px solid GrayText;border-radius:7px;padding:7px 10px;max-width:100%}select{width:100%}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}:focus-visible{outline:3px solid Highlight;outline-offset:3px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}nav button[aria-pressed="true"]{background:Highlight;color:HighlightText}.round{border:1px solid GrayText;border-radius:10px;margin:18px 0;padding:16px;overflow:auto}.round h2{font-size:16px;margin:0 0 12px}.tree,.tree ul{list-style:none;margin:0;padding-left:30px}.tree{padding-left:0;min-width:310px}.tree li{position:relative;padding:8px 0 8px 20px}.tree ul{border-left:1px solid GrayText;margin-left:16px}.tree ul>li:before{content:"";position:absolute;left:0;top:28px;width:20px;border-top:1px solid GrayText}.node{display:inline-block;border:1px solid GrayText;border-radius:8px;padding:10px 13px;max-width:560px;overflow-wrap:anywhere}.main{border:2px solid Highlight}.node strong{display:block}.node button{text-align:left;margin:6px 0}.pill{font-size:12px;margin-left:8px;color:GrayText}details{margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}article.agent{padding:12px;border-bottom:1px solid GrayText}#more{margin:10px 0}#message{color:MarkText;background:Mark;border-radius:6px;padding:0 8px}
</style></head><body>
<h1>AI Loop 代理看板</h1><p id="note">正在连接宿主…</p>
<label for="workspace">工作区</label><select id="workspace"><option value="">读取中…</option></select><button id="discover" type="button">重新检测工作区</button>
<p id="scope">宿主未提供聊天标识时，可选择工作区查看运行。</p>
<label for="run">任务运行</label><select id="run"><option value="">先选择工作区</option></select>
<nav aria-label="看板视图"><button data-view="agents" aria-pressed="true">代理树</button><button data-view="tasks" aria-pressed="false">任务</button><button data-view="activity" aria-pressed="false">活动记录</button><button id="refresh" type="button">刷新</button></nav>
<p id="message" role="status"></p><section id="view" aria-live="polite"><p class="muted">等待看板数据…</p></section><button id="more" type="button" hidden>加载更早任务</button>
<script>
const $=id=>document.getElementById(id),app=window.openai,pending=new Map();
let rpcId=1,payload=null,activeView='agents',workspacesLoaded=false,runsRequestId=0,statusRequestId=0,chat=null,history=null,workspaceRows=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const roles={planner:'计划',dev:'开发',tester:'测试',reviewer:'评审',scribe:'记录'};
const sameRoot=(a,b)=>Boolean(a&&b)&&(a===b||(/^[a-z]:[\\/]/i.test(a)&&a.replace(/\\/g,'/').toLowerCase()===b.replace(/\\/g,'/').toLowerCase()));
function structured(result){const value=result?.result??result;if(value?.isError)throw Error((value.content??[]).filter(item=>item.type==='text').map(item=>item.text).join('\n')||'看板工具返回错误');return value?.structuredContent??value;}
window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=='2.0')return;
  if(message.id&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);message.error?item.reject(Error(message.error.message??'MCP App 请求失败')):item.resolve(message.result);return;}
  if(message.method==='ui/notifications/tool-result'){try{const value=structured(message.params);if(value?.workspaces)acceptInitial(value);}catch(error){$('note').textContent=error.message;}}
});
function request(method,params={}){const id=rpcId++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('MCP App 宿主响应超时'));},10000);pending.set(id,{resolve:value=>{clearTimeout(timer);resolve(value);},reject:error=>{clearTimeout(timer);reject(error);}});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
async function call(name,args={}){let value;try{value=await request('tools/call',{name,arguments:args});}catch(error){if(!app?.callTool)throw error;value=await app.callTool(name,args);}return structured(value);}
function fillWorkspaces(workspaces){workspacesLoaded=true;workspaceRows=workspaces;$('workspace').innerHTML='<option value="">选择工作区</option>'+workspaces.map(item=>`<option value="${esc(item.root)}">${esc(item.label??item.root)} · ${esc(item.root)}${item.enabled?' · 已启用':' · 已停用'}</option>`).join('');if(!workspaces.length)$('note').textContent='未发现工作区。请先在 Codex 中打开项目，再刷新看板。';}
function acceptInitial(value){const previous=$('workspace').value;fillWorkspaces(value.workspaces);$('note').textContent=value.discovery_error||value.note||'观察仅代表最后一次记录。';const context=value.context;chat=context?.root&&context?.session_id?{root:context.root,id:context.session_id}:null;const selected=workspaceRows.find(item=>sameRoot(item.root,context?.root??previous));$('workspace').value=selected?.root??'';if(selected)loadRuns();}
function agentNode(agent){
  const id=[agent.session_id,agent.context?.id,agent.native_id].find(value=>typeof value==='string'&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(value));
  const navigable=agent.harness==='codex'&&Boolean(id);
  return `<li><div class="node"><strong>${esc(roles[agent.role]??agent.role??'代理')}${agent.direction?' · '+esc(agent.direction):''}<span class="pill">${esc(agent.state??'未知')}</span></strong><p>${esc(agent.summary??agent.observation?.summary??'暂无摘要')}</p><button type="button" data-session="${navigable?esc(id):''}" ${navigable?'':'disabled'}>${navigable?'进入子代理聊天':'未记录可打开的聊天标识'}</button><details><summary>调用详情</summary><pre>原生 ID：${esc(agent.native_id??'尚未获取')}\n任务：${esc(agent.task??'—')}\n请求模型：${esc(agent.requested?.model??'未记录')}\n观测模型：${esc(agent.effective_model??'unverified')}\nToken 输入/输出：${agent.usage?esc(agent.usage.input_tokens??'不可获取')+' / '+esc(agent.usage.output_tokens??'不可获取'):'不可获取'}\n最近观察：${esc(agent.updated_at??'未知')}\n${esc(agent.note??'')}${agent.stale?'\n观察可能已过期':''}</pre></details></div></li>`;
}
function tree(data){
  const agents=data?.activity?.agents??[],run=data?.run??{},tasks=run.tasks??[],assigned=new Set();
  const branches=tasks.map(task=>{const children=agents.filter(a=>a.task===task.id);children.forEach(a=>assigned.add(a));return `<li><div class="node"><strong>${esc(task.title??task.id)}</strong><span class="muted">${esc(task.id)} · ${esc(task.phase??'未知')}</span></div>${children.length?'<ul>'+children.map(agentNode).join('')+'</ul>':''}</li>`;}).join('');
  const remaining=agents.filter(a=>!assigned.has(a));
  return `<section class="round"><h2>${esc(run.goal??run.run_id??'任务运行')} <span class="pill">${esc(run.status??'未知')}</span></h2><ul class="tree"><li><div class="node main"><strong>主代理</strong><span class="muted">${esc(run.run_id??'')} · ${agents.length} 次调用</span></div><ul>${branches}${remaining.length?'<li><div class="node">整体协作</div><ul>'+remaining.map(agentNode).join('')+'</ul></li>':''}</ul></li></ul>${agents.length?'':'<p class="muted">此运行没有匹配的代理观察记录。</p>'}</section>`;
}
function render(data){payload=data;const rounds=data?.rounds??[data];$('view').innerHTML=rounds.map(item=>{
  if(activeView==='tasks')return (item?.run?.tasks??[]).map(task=>`<article class="agent"><strong>${esc(task.title??task.id)}</strong><p>${esc(task.phase)} · 验证 ${esc(task.verification?.status??'待验证')} · 评审 ${esc(task.assessment?.status??'待复核')}</p><p>${esc(task.reason??task.blocked_reason??'')}</p></article>`).join('');
  if(activeView==='activity')return (item?.events??[]).slice().reverse().map(event=>`<article class="agent"><strong>#${esc(event.seq)} ${esc(event.type)}</strong><p>${esc(event.summary??event.reason??JSON.stringify(event))}</p></article>`).join('')||'<p class="muted">选择单次运行后可查看其活动记录。</p>';
  return tree(item);
}).join('')||'<p class="muted">此聊天尚无关联的任务记录。</p>';}
async function loadRuns(){
  const root=$('workspace').value,requestId=++runsRequestId;++statusRequestId;payload=null;history=null;$('more').hidden=true;$('message').textContent='';$('run').value='';$('run').innerHTML='<option value="">读取中…</option>';$('view').innerHTML='<p class="muted">正在读取任务运行…</p>';
  const bound=chat&&sameRoot(chat.root,root);$('scope').textContent=bound?'当前聊天 · 按运行展示历次任务':'工作区全部运行 · 宿主未提供此工作区的当前聊天标识';
  if(!root){$('run').innerHTML='<option value="">先选择工作区</option>';$('view').innerHTML='<p class="muted">请选择工作区。</p>';return;}
  try{const result=await call('ai_loop.dashboard.runs',{root,...(bound?{session:chat.id}:{})});if(requestId!==runsRequestId||root!==$('workspace').value)return;
    $('run').innerHTML=(bound?'<option value="@history">当前聊天 · 全部任务历史</option>':'<option value="">选择运行</option>')+(result.runs??[]).map(run=>`<option value="${esc(run.run_id)}">${esc(run.project_path??'.')} / ${esc(run.run_id)} · ${esc(run.status)} · ${esc(run.goal??'')}</option>`).join('');
    if(bound){$('run').value='@history';await refresh();}else $('view').innerHTML='<p class="muted">请选择运行。这里列出工作区全部记录。</p>';
  }catch(error){if(requestId!==runsRequestId||root!==$('workspace').value)return;$('run').innerHTML='<option value="">读取失败</option>';$('note').textContent=error.message;$('view').innerHTML='<p class="muted">读取失败，请刷新重试。</p>';}
}
async function refresh(more=false){
  const root=$('workspace').value,run=$('run').value,requestId=++statusRequestId;if(!root||!run){payload=null;$('view').innerHTML='<p class="muted">请选择工作区和运行。</p>';return;}
  const cursor=more?history?.next_after:null;if(!more){history=null;payload=null;$('view').innerHTML='<p class="muted">正在读取最近观察…</p>';}$('more').hidden=true;
  try{let result;if(run==='@history'){if(!chat||!sameRoot(chat.root,root))throw Error('当前聊天未绑定工作区');result=await call('ai_loop.dashboard.history',{root,session:chat.id,...(cursor?{after:cursor}:{})});}else result=await call('ai_loop.dashboard.status',{root,run,...(chat&&sameRoot(chat.root,root)?{session:chat.id}:{})});
    if(requestId!==statusRequestId||root!==$('workspace').value||run!==$('run').value)return;
    if(run==='@history'){result={...result,rounds:[...(more?history?.rounds??[]:[]),...(result.rounds??[])]};history=result;$('more').hidden=!result.next_after;$('message').textContent=result.unbound_count?`${result.unbound_count} 条旧运行未记录聊天归属，可在工作区运行列表查看。`:'';}render(result);
  }catch(error){if(requestId!==statusRequestId||root!==$('workspace').value||run!==$('run').value)return;$('view').innerHTML=`<p>${esc(error.message)}</p>`;}
}
async function init(){try{let connected=false;try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'AI Loop 代理看板',version:'4.6.2'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});connected=true;}catch(error){if(!app?.callTool)throw error;}if(connected)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(app?.toolOutput){const initial=structured(app.toolOutput);if(initial?.workspaces)acceptInitial(initial);}if(!workspacesLoaded)acceptInitial(await call('ai_loop.dashboard'));}catch(error){$('note').textContent=error.message;}}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{activeView=button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));if(payload)render(payload);}));
$('workspace').addEventListener('change',loadRuns);$('run').addEventListener('change',()=>refresh());$('refresh').addEventListener('click',()=>refresh());$('more').addEventListener('click',()=>refresh(true));
$('discover').addEventListener('click',async()=>{try{acceptInitial(await call('ai_loop.dashboard',chat?{root:chat.root,session:chat.id}:{}));}catch(error){$('note').textContent=error.message;}});
$('view').addEventListener('click',async event=>{const button=event.target.closest?.('button[data-session]');if(!button?.dataset.session)return;try{const result=await request('ui/open-link',{url:'codex://threads/'+encodeURIComponent(button.dataset.session)});if(result?.isError)throw Error('宿主拒绝打开此聊天');$('message').textContent='已向宿主请求打开子代理聊天。';}catch(error){$('message').textContent='宿主未能打开聊天：'+error.message;}});init();
</script></body></html>
