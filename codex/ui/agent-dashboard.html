<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Loop 工作流</title><style>
:root{color-scheme:light dark;--loop-accent:#3b82f6;--loop-success:#22c55e;--loop-danger:#ef4444;--loop-radius:10px;--loop-space:12px;--loop-font:13px;--loop-indent:14px;/* LOOP_THEME */font:var(--loop-font)/1.6 system-ui,sans-serif}*{box-sizing:border-box;min-width:0}body{margin:0;padding:16px;color:CanvasText;background:Canvas}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 8px}p{margin:6px 0 12px}.muted,#note,#scope,#settings-status{color:GrayText;font-size:12px}label{display:grid;gap:5px;margin:10px 0}select,button,input{font:inherit;color:CanvasText;background:Canvas;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:7px;padding:7px 10px;max-width:100%}select{width:100%}input[type=checkbox]{accent-color:var(--loop-accent);width:17px;height:17px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}:focus-visible{outline:3px solid var(--loop-accent);outline-offset:3px}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button[aria-pressed=true],button.primary{background:var(--loop-accent);color:white;border-color:var(--loop-accent)}[hidden]{display:none!important}.card,.round{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:var(--loop-radius);margin:12px 0;padding:var(--loop-space);overflow-wrap:anywhere}.field-row{display:flex;align-items:center;gap:8px}.role{display:grid;gap:4px}.role label{margin:4px 0}.tree,.tree ul{list-style:none;margin:0;padding:0}.tree li{position:relative;margin-top:10px}.tree ul{border-left:1px solid color-mix(in srgb,var(--loop-accent) 35%,transparent);margin:10px 0 0 7px;padding-left:var(--loop-indent)}.tree ul>li:before{content:"";position:absolute;left:calc(-1 * var(--loop-indent));top:20px;width:var(--loop-indent);border-top:1px solid color-mix(in srgb,var(--loop-accent) 35%,transparent)}.node{display:block;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:var(--loop-radius);padding:10px 12px;overflow-wrap:anywhere;background:color-mix(in srgb,CanvasText 3%,Canvas)}.node.main{border-color:var(--loop-accent)}.node strong{display:block}.node button{text-align:left;margin:6px 0}.pill{font-size:11px;margin-left:8px;color:GrayText}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--loop-danger);margin-right:6px}.dot.enabled{background:var(--loop-success)}details{margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}article.agent{padding:12px;border-bottom:1px solid color-mix(in srgb,CanvasText 18%,transparent)}#message{overflow-wrap:anywhere}#message:empty{display:none}#message[role=alert]{color:var(--loop-danger)}.summary{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.draft{color:var(--loop-accent)}@media(max-width:400px){body{padding:10px}.tree ul{margin-left:3px;padding-left:10px}.tree ul>li:before{left:-10px;width:10px}.node{padding:9px}.actions button{flex:1 1 auto}}

.graph-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}.graph-tools button{font-size:12px;padding:5px 9px}.graph-legend{font-size:12px;color:GrayText;margin:8px 0}.graph-port{position:relative;overflow:auto;max-height:640px;min-height:300px;height:60vh;border:1px solid color-mix(in srgb,CanvasText 15%,transparent);border-radius:10px;background:radial-gradient(circle,color-mix(in srgb,CanvasText 12%,transparent) 1px,transparent 1px) 0 0/20px 20px;cursor:grab;overscroll-behavior:contain;touch-action:pan-x pan-y}.graph-port:active{cursor:grabbing}.graph-spacer{position:relative;margin:0 auto}.graph-canvas{position:absolute;inset:0 auto auto 0;transform-origin:top left}.graph-links{position:absolute;inset:0;overflow:visible;pointer-events:none}.graph-node{position:absolute;border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-top:3px solid var(--node-color,var(--loop-accent));border-radius:10px;background:Canvas;color:CanvasText;padding:10px 12px;overflow:hidden;font-size:13px;line-height:1.5;box-shadow:0 2px 5px #00000008}.graph-node[data-kind=main]{border-color:var(--loop-accent)}.graph-node .node-title{display:block;text-align:left;border:0;padding:0;background:transparent;font-weight:600;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:2px}.graph-node .node-meta{font-size:12px;color:GrayText;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:4px}.graph-node .collapse{position:absolute;right:8px;bottom:6px;padding:0 5px;font-size:11px}.graph-selection{margin:12px 0;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:10px;padding:12px}.graph-selection ul,.graph-details ul{list-style:none;padding:0;margin:0}.graph-selection .node,.graph-details .node{margin:8px 0}.graph-warnings{color:var(--loop-warning,#eab308);font-size:12px}.graph-port:focus-visible{outline:3px solid var(--loop-accent);outline-offset:2px}
</style></head><body>
<header><div class="summary"><h1>AI Loop 工作流</h1><span id="saved-state" class="muted">未选择工作区</span></div><p id="note">正在连接宿主…</p></header>
<label for="workspace">Codex 工作区</label><select id="workspace"><option value="">读取中…</option></select>
<div class="actions"><button id="discover" type="button">刷新工作区</button><span id="dirty" class="draft"></span></div><p id="scope">宿主未提供当前聊天标识，请选择工作区。</p>
<nav aria-label="工作流页面"><button data-page="settings" aria-pressed="true">工作流配置</button><button data-page="dashboard" aria-pressed="false">工作流看板</button></nav><p id="message" role="status" aria-live="polite"></p>
<section id="settings-page" aria-label="工作流配置"><div id="settings"><p class="muted">正在读取配置…</p></div><p id="settings-status"></p><div class="actions"><button id="save" class="primary" type="button" disabled>统一保存</button><button id="discard" type="button" disabled>放弃草稿</button><button id="inherit" type="button" disabled>恢复全局继承</button></div></section>
<section id="dashboard-page" aria-label="工作流看板" hidden><p class="muted">从上到下展示阶段分支与汇合，由主代理统一调度。状态是最后一次观察；子代理结束不等于任务通过。</p><label for="run">任务运行</label><select id="run"><option value="">先选择工作区</option></select>
<nav aria-label="看板视图"><button data-view="agents" aria-pressed="true">工作流图</button><button data-view="tasks" aria-pressed="false">任务</button><button data-view="activity" aria-pressed="false">活动记录</button><button id="refresh" type="button">刷新</button></nav>
<section id="view" aria-live="polite"><p class="muted">选择工作区查看运行。</p></section><button id="more" type="button" hidden>加载更早任务</button></section>
<script>
/* LOOP_GRAPH */
const graphViews=new Map(),graphData=new Map();
let graphDrag=null;
const $=id=>document.getElementById(id),app=window.openai,pending=new Map();
const panelId='panel-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let bridgeConnected=false,rpcId=1,payload=null,activeView='agents',workspacesLoaded=false,runsRequestId=0,statusRequestId=0,settingsRequestId=0,chat=null,history=null,workspaceRows=[],settingsData=null,busy=false,openingContext=null,entryInput=null,entryRequestId=0;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const roles={planner:'计划',dev:'开发',tester:'测试',reviewer:'评审',scribe:'记录'};
const states={active:'进行中',complete:'已完成',developed:'待验证',PASS:'已通过',FAIL:'未通过',APPROVED:'已批准',REJECTED:'被拒绝',requested:'已请求',running:'运行中',waiting:'等待中',completed:'已结束',failed:'失败',stopped:'已停止',unknown:'未知',stop_requested:'待确认停止',pending:'待开始',developing:'开发中',verifying:'验证中',reviewing:'评审中',done:'已完成',needs_fix:'待修复',blocked:'阻塞'};
const sameRoot=(a,b)=>Boolean(a&&b)&&(a===b||(/^[a-z]:[\\/]/i.test(a)&&a.replace(/\\/g,'/').toLowerCase()===b.replace(/\\/g,'/').toLowerCase()));
const rowValue=row=>row.id??row.root,selected=()=>workspaceRows.find(row=>rowValue(row)===$('workspace').value),rootsOf=row=>row?.roots??(row?.root?[row.root]:[]);
const boundChat=()=>chat&&((chat.workspaceId&&chat.workspaceId===selected()?.id)||(!chat.workspaceId&&(rootsOf(selected()).some(root=>sameRoot(root,chat.root))||sameRoot(chat.root,$('workspace').value))));
const rootFor=()=>selected()?.root??$('workspace').value,workspaceArgs=()=>selected()?.id?{workspace_id:selected().id}:{root:rootFor()};
function structured(result){const value=result?.result??result;if(value?.isError)throw Error((value.content??[]).filter(item=>item.type==='text').map(item=>item.text).join('\n')||'工具返回错误');return value?.structuredContent??value;}
function message(text,error=false){$('message').textContent=text;$('message').setAttribute?.('role',error?'alert':'status');}
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;const data=event.data;if(!data||data.jsonrpc!=='2.0')return;
 if(data.id&&pending.has(data.id)){const item=pending.get(data.id);pending.delete(data.id);data.error?item.reject(Error(data.error.message??'宿主请求失败')):item.resolve(data.result);return;}
 if(data.method==='ui/notifications/tool-result'){try{const value=structured(data.params);if(value?.workspaces)acceptInitial(value,true);}catch(error){message(error.message,true);}}
 if(data.method==='ui/notifications/tool-input'){acceptToolInput(data.params).catch(error=>message(error.message,true));}
});
function contextArgs(input){if(!input||typeof input!=='object'||Array.isArray(input))return null;const args={};if(typeof input.root==='string'&&input.root.trim())args.root=input.root;if(typeof input.session==='string'&&input.session.trim())args.session=input.session;return Object.keys(args).length?args:null;}
function matchesEntry(value){if(entryInput===null)return true;const context=value.context??{},args=entryInput;if(args.session&&context.session_id!==args.session)return false;if(!args.session&&context.session_id)return false;if(args.root&&!sameRoot(context.root,args.root)&&!(value.workspaces??[]).some(row=>row.id===context.workspace_id&&rootsOf(row).some(root=>sameRoot(root,args.root))))return false;return Boolean(args.root||args.session)||!context.root&&!context.workspace_id;}
function clearEntry(){$('workspace').disabled=busy;chat=null;openingContext=null;payload=null;history=null;settingsData=null;++runsRequestId;++statusRequestId;++settingsRequestId;$('workspace').value='';$('run').value='';$('run').innerHTML='<option value="">先选择工作区</option>';$('view').innerHTML='<p class="muted">等待可靠聊天上下文，或手动选择工作区。</p>';$('more').hidden=true;$('settings').innerHTML='<p class="muted">等待定位或选择工作区…</p>';$('dirty').textContent='';$('settings-status').textContent='';['save','discard','inherit'].forEach(id=>{$(id).disabled=true;});savedState();updateScope();}
async function acceptToolInput(input){const args=contextArgs(input)??{};entryInput=args;const seq=++entryRequestId;clearEntry();if(!bridgeConnected&&!app?.callTool)return;try{const value=await call('ai_loop.dashboard',args);if(seq===entryRequestId)acceptInitial(value,true);}catch(error){if(seq===entryRequestId)throw error;}}
function request(method,params={}){const id=rpcId++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('宿主响应超时，请重试'));},10000);pending.set(id,{resolve:value=>{clearTimeout(timer);resolve(value);},reject:error=>{clearTimeout(timer);reject(error);}});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
async function call(name,args={}){const value=!bridgeConnected&&app?.callTool?await app.callTool(name,args):await request('tools/call',{name,arguments:args});return structured(value);}
function fillWorkspaces(rows){const previous=$('workspace').value;workspacesLoaded=true;workspaceRows=rows;$('workspace').innerHTML='<option value="">全局默认 · 请选择工作区</option>'+rows.map(row=>'<option value="'+esc(rowValue(row))+'">'+(row.enabled?'🟢':'🔴')+' '+esc(row.label??row.root)+(row.id?' · '+esc(row.id.slice(0,8)):'')+' · '+(row.enabled?'已启用':'未启用')+(rootsOf(row).length>1?' · '+rootsOf(row).length+' 个成员根':'')+'</option>').join('');$('workspace').value=rows.some(row=>rowValue(row)===previous)?previous:'';savedState();}
function savedState(){const row=selected();$('saved-state').innerHTML=row?'<span class="dot '+(row.enabled?'enabled':'')+'"></span>'+(row.enabled?'已启用':'未启用'):'未选择工作区';}
function updateScope(){$('scope').textContent=boundChat()?'当前聊天 · 已定位所属工作区':'工作区范围 · 没有此工作区的可靠聊天上下文';}
function acceptInitial(value,entry=false){
 if(entry&&!matchesEntry(value))return;
 const previous=$('workspace').value,context=value.context;let contextChanged=false;fillWorkspaces(value.workspaces??[]);$('note').textContent=value.discovery_error||value.note||'选择只查看；统一保存后生效。';
 const signature=context?JSON.stringify([context.session_id,context.workspace_id,context.root]):null;
 if(context&&(openingContext===null||(entry&&signature!==openingContext))){contextChanged=true;openingContext=signature;chat=context.session_id?{id:context.session_id,root:context.root,workspaceId:context.workspace_id}:null;const row=workspaceRows.find(row=>(typeof context.workspace_id==='string'&&row.id===context.workspace_id)||rootsOf(row).some(root=>sameRoot(root,context.root)));$('workspace').value=row?rowValue(row):'';}
 savedState();updateScope();
 if(contextChanged||previous!==$('workspace').value||!settingsData){loadSettings(selected()?.id?{workspace_id:selected().id}:{workspace_root:rootFor()}).catch(error=>message(error.message,true));loadRuns();}
}
function field(name,schema,values){const value=values[name],title=schema.title??name;let input;
 if(schema.type==='boolean')input='<label class="field-row"><input data-field="'+esc(name)+'" type="checkbox" '+(value?'checked':'')+'>'+esc(title)+'</label>';
 else if(schema.enum)input='<label>'+esc(title)+'<select data-field="'+esc(name)+'">'+schema.enum.map(option=>'<option value="'+esc(option)+'" '+(option===value?'selected':'')+'>'+esc(option)+'</option>').join('')+'</select></label>';
 else input='<label>'+esc(title)+'<input data-field="'+esc(name)+'" type="number" min="'+esc(schema.minimum??1)+'" max="'+esc(schema.maximum??8)+'" value="'+esc(value)+'"></label>';
 return input+(schema.description?'<p class="muted">'+esc(schema.description)+'</p>':'');
}
function renderSettings(data){settingsData=data;const props=data.schema?.properties??{},values=data.values??{};const groups=[['工作区与范围',['scope','workspace_enabled','workspace_profile_source_id']],...Object.keys(roles).map(role=>[roles[role]+'代理',['model.'+role,'effort.'+role]]),['执行设置',['concurrency']]];
 $('settings').innerHTML=groups.map(([title,names])=>'<section class="card role"><h2>'+esc(title)+'</h2>'+names.filter(name=>props[name]).map(name=>field(name,props[name],values)).join('')+'</section>').join('');
 $('dirty').textContent=data.dirty?'有未保存修改':'';$('settings-status').textContent=data.status??(data.layout??[]).filter(item=>item.title?.startsWith('状态')).map(item=>item.title).join(' ');
 $('workspace').disabled=busy;document.querySelectorAll('[data-field]').forEach(input=>{input.disabled=busy;});$('save').disabled=busy||!selected()||!data.dirty;$('discard').disabled=busy||!data.dirty;$('inherit').disabled=busy||!selected()||!['project','仅当前工作区'].includes(data.selection?.scope??values.scope);
}
async function loadSettings(set){const seq=++settingsRequestId;const choosing=set&&(Object.hasOwn(set,'workspace_id')||Object.hasOwn(set,'workspace_root'));const target={...(selected()?.id?{workspace_id:selected().id}:{workspace_root:rootFor()}),scope:choosing?(selected()?'project':'global'):(settingsData?.selection?.scope??settingsData?.values?.scope??(selected()?'project':'global'))};let data=await call(set?'ai_loop.panel.update':'ai_loop.panel.read',{panel_id:panelId,...(set?{set:{...target,...set}}:{})});if(seq!==settingsRequestId)return;if(!set&&data.panel_created){data=await call('ai_loop.panel.update',{panel_id:panelId,set:target});if(seq!==settingsRequestId)return;}renderSettings(data);return data;}
async function saveAction(action){if(busy)return;const seq=entryRequestId,workspace=$('workspace').value,current=()=>seq===entryRequestId&&workspace===$('workspace').value;busy=true;if(settingsData)renderSettings(settingsData);try{const data=await call('ai_loop.panel.action',{panel_id:panelId,action});if(!current())return;renderSettings(data);message(data.action_result?.message??'操作已完成');const latest=await call('ai_loop.dashboard',chat?{session:chat.id}:{});if(!current())return;fillWorkspaces(latest.workspaces);$('note').textContent=latest.discovery_error||latest.note||'';}catch(error){if(current())message(error.message,true);}finally{busy=false;$('workspace').disabled=false;if(settingsData)renderSettings(settingsData);}}
function agentNode(agent){const id=[agent.session_id,agent.context?.id,agent.native_id].find(value=>typeof value==='string'&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(value));const navigable=agent.harness==='codex'&&Boolean(id);
 return '<li><div class="node"><strong>'+esc(roles[agent.role]??agent.role??'代理')+(agent.direction?' · '+esc(agent.direction):'')+'<span class="pill">'+esc(states[agent.state]??agent.state??'未知')+'</span></strong><p>'+esc(agent.summary??agent.observation?.summary??'暂无摘要')+'</p><button type="button" data-session="'+(navigable?esc(id):'')+'" '+(navigable?'':'disabled')+'>'+(navigable?'进入子代理聊天':'未记录可打开的聊天标识')+'</button><details><summary>调用详情</summary><pre>原生 ID：'+esc(agent.native_id??'尚未获取')+'\n任务：'+esc(agent.task??'—')+'\n请求模型：'+esc(agent.requested?.model??'未记录')+'\n观测模型：'+esc(agent.effective_model??'unverified')+'\nToken 输入/输出：'+(agent.usage?esc(agent.usage.input_tokens??'不可获取')+' / '+esc(agent.usage.output_tokens??'不可获取'):'不可获取')+'\n最近观察：'+esc(agent.updated_at??'未知')+(agent.stale?'\n观察可能已过期':'')+'</pre></details></div></li>';
}
function graphKey(data){return JSON.stringify([data?.root??data?.run?.project_root??'',data?.run?.run_id??'']);}
function graphState(key){if(!graphViews.has(key))graphViews.set(key,{zoom:1,collapsed:[],selected:null,left:0,top:0});return graphViews.get(key);}
function graphColor(role,graph){return graph.theme?.roleColors?.[role]??graph.theme?.accent??'#3b82f6';}
function graphMarkup(data,key){const state=graphState(key),graph=createWorkflowGraph(data,{collapsedTasks:state.collapsed});graphData.set(key,{data,graph});const byId=new Map(graph.nodes.map(node=>[node.id,node]));
 const edges=graph.edges.map(edge=>{const from=byId.get(edge.source),to=byId.get(edge.target);if(!from||!to)return '';const x1=from.x+from.width/2,y1=from.y+from.height,x2=to.x+to.width/2,y2=to.y,middle=(y1+y2)/2;return '<path d="M '+x1+' '+y1+' C '+x1+' '+middle+', '+x2+' '+middle+', '+x2+' '+y2+'" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".4"'+(edge.kind==='dependency'?' stroke-dasharray="6 4"':edge.kind==='call'?' stroke-dasharray="2 4"':'')+'><title>'+esc(edge.kind==='call'?'真实调用':edge.kind==='dependency'?'任务依赖':'阶段交接')+'</title></path>';}).join('');
 const nodes=graph.nodes.map(node=>'<div class="graph-node" role="button" tabindex="0" data-node="'+esc(node.id)+'" aria-label="'+esc(node.label)+'调用详情" data-kind="'+esc(node.kind)+'" style="left:'+node.x+'px;top:'+node.y+'px;width:'+node.width+'px;height:'+node.height+'px;--node-color:'+graphColor(node.role,graph)+'"><button class="node-title" type="button" data-node="'+esc(node.id)+'" title="'+esc(node.label)+'">'+esc(node.label)+'</button><span class="node-meta">'+esc(states[node.status]??node.status??'待开始')+'</span><span class="node-meta">'+(node.agents?.length?node.agents.length+' 次调用 · 点击查看详情':node.kind==='main'?'统一调度':node.kind==='task'?'正式任务':'尚无调用')+'</span>'+(node.kind==='task'?'<button class="collapse" type="button" data-collapse="'+esc(node.taskId)+'" aria-expanded="'+(!state.collapsed.includes(node.taskId))+'">'+(state.collapsed.includes(node.taskId)?'展开':'收起')+'</button>':'')+'</div>').join('');
 const selected=graph.nodes.find(node=>node.id===state.selected),all=data?.activity?.agents??[];
 return '<div class="graph-tools" aria-label="画布工具"><button type="button" data-graph-action="out" aria-label="缩小">缩小</button><span class="graph-percent">'+Math.round(state.zoom*100)+'%</span><button type="button" data-graph-action="in" aria-label="放大">放大</button><button type="button" data-graph-action="fit">适应画布</button><button type="button" data-graph-action="reset">重置</button><button type="button" data-graph-action="expand">全部展开</button><button type="button" data-graph-action="collapse">全部收起</button></div><p class="graph-legend">实线：阶段交接 · 虚线：任务依赖 · 点线：真实调用</p><p class="muted">拖动画布空白处或滚动平移；按钮缩放。未调用节点表示计划阶段，不代表已执行。</p>'+(graph.warnings?.length?'<p class="graph-warnings">'+graph.warnings.map(esc).join('；')+'</p>':'')+'<div class="graph-port" tabindex="0" aria-label="纵向工作流图，可滚动平移"><div class="graph-spacer" style="width:'+graph.width*state.zoom+'px;height:'+graph.height*state.zoom+'px"><div class="graph-canvas" style="width:'+graph.width+'px;height:'+graph.height+'px;transform:scale('+state.zoom+')"><svg class="graph-links" width="'+graph.width+'" height="'+graph.height+'" aria-hidden="true">'+edges+'</svg>'+nodes+'</div></div></div>'+(selected?'<section class="graph-selection"><h2>'+esc(selected.label)+'</h2><p class="muted">'+esc(states[selected.status]??selected.status??'待开始')+' · 调用结束不等于任务通过</p><ul>'+(selected.agents?.length?selected.agents.map(agentNode).join(''):'<li class="muted">尚无调用记录。</li>')+'</ul></section>':'')+'<details class="graph-details"><summary>全部调用详情（'+all.length+' 次）</summary><ul>'+all.map(agentNode).join('')+'</ul></details>';
}
function tree(data){const key=graphKey(data),run=data?.run??{};return '<section class="round" data-graph-key="'+esc(key)+'"><h2>'+esc(run.goal??run.run_id??'任务运行')+'<span class="pill">'+esc(states[run.status]??run.status??'未知')+'</span></h2><p class="muted">'+esc(run.run_id??'')+'</p>'+graphMarkup(data,key)+'</section>';}
function rememberGraphPositions(){document.querySelectorAll('[data-graph-key]').forEach(section=>{const port=section.querySelector('.graph-port');if(port){const state=graphState(section.dataset.graphKey);state.left=port.scrollLeft;state.top=port.scrollTop;}});}
function restoreGraphPositions(){document.querySelectorAll('[data-graph-key]').forEach(section=>{const port=section.querySelector('.graph-port'),state=graphState(section.dataset.graphKey);if(port){port.scrollLeft=state.left;port.scrollTop=state.top;}});}
function updateGraph(section){const key=section.dataset.graphKey,record=graphData.get(key);if(!record)return;const state=graphState(key),port=section.querySelector('.graph-port');if(port){state.left=port.scrollLeft;state.top=port.scrollTop;}section.innerHTML='<h2>'+esc(record.data?.run?.goal??record.data?.run?.run_id??'任务运行')+'</h2>'+graphMarkup(record.data,key);restoreGraphPositions();}
function render(data){rememberGraphPositions();payload=data;const rounds=data?.rounds??[data];$('view').innerHTML=rounds.map(item=>{
 if(activeView==='tasks')return(item?.run?.tasks??[]).map(task=>'<article class="agent"><strong>'+esc(task.title??task.id)+'</strong><p>'+esc(states[task.phase]??task.phase)+' · 验证 '+esc(task.verification?.status??'待验证')+' · 评审 '+esc(task.assessment?.status??'待复核')+'</p><p>'+esc(task.reason??task.blocked_reason??'')+'</p></article>').join('');
 if(activeView==='activity')return(item?.events??[]).slice().reverse().map(event=>'<article class="agent"><strong>#'+esc(event.seq)+' '+esc(event.type)+'</strong><p>'+esc(event.summary??event.reason??JSON.stringify(event))+'</p></article>').join('')||'<p class="muted">选择单次运行后查看活动记录。</p>';return tree(item);
 }).join('')||'<p class="muted">此聊天尚无关联的任务记录。</p>';restoreGraphPositions();}
async function loadRuns(){const value=$('workspace').value,requestId=++runsRequestId;++statusRequestId;payload=null;history=null;$('more').hidden=true;$('run').value='';$('run').innerHTML='<option value="">读取中…</option>';updateScope();if(!value){$('run').innerHTML='<option value="">先选择工作区</option>';$('view').innerHTML='<p class="muted">请选择工作区。</p>';return;}try{const result=await call('ai_loop.dashboard.runs',{...workspaceArgs(),...(boundChat()?{session:chat.id}:{})});if(requestId!==runsRequestId||value!==$('workspace').value)return;$('run').innerHTML=(boundChat()?'<option value="@history">当前聊天 · 全部任务历史</option>':'<option value="">选择运行</option>')+(result.runs??[]).map(run=>'<option value="'+esc(run.record_root?JSON.stringify([run.record_root,run.run_id]):run.run_id)+'">'+esc(run.run_id)+' · '+esc(states[run.status]??run.status)+' · '+esc(run.goal??'')+'</option>').join('');if(boundChat()){$('run').value='@history';await refresh();}else $('view').innerHTML='<p class="muted">请选择运行。这里列出工作区全部记录。</p>';}catch(error){if(requestId!==runsRequestId||value!==$('workspace').value)return;$('run').innerHTML='<option value="">读取失败</option>';$('note').textContent=error.message;$('view').innerHTML='<p class="muted">读取失败，请刷新重试。</p>';}}
async function refresh(more=false){rememberGraphPositions();const workspace=$('workspace').value,value=$('run').value,requestId=++statusRequestId;if(!workspace||!value){payload=null;$('view').innerHTML='<p class="muted">请选择工作区和运行。</p>';return;}const cursor=more?history?.next_after:null;if(!more){history=null;payload=null;$('view').innerHTML='<p class="muted">正在读取最近观察…</p>';}$('more').hidden=true;try{let result;if(value==='@history'){if(!boundChat())throw Error('当前聊天未绑定工作区');result=await call('ai_loop.dashboard.history',{...workspaceArgs(),session:chat.id,...(cursor?{after:cursor}:{})});}else{let root=rootFor(),run=value;if(value.startsWith('[')){[root,run]=JSON.parse(value);}result=await call('ai_loop.dashboard.status',{root,run,...(boundChat()?{session:chat.id}:{})});}if(requestId!==statusRequestId||workspace!==$('workspace').value||value!==$('run').value)return;if(value==='@history'){result={...result,rounds:[...(more?history?.rounds??[]:[]),...(result.rounds??[])]};history=result;$('more').hidden=!result.next_after;message(result.unbound_count?result.unbound_count+' 条旧运行未记录聊天归属。':'');}render(result);}catch(error){if(requestId===statusRequestId&&workspace===$('workspace').value&&value===$('run').value)$('view').innerHTML='<p>'+esc(error.message)+'</p>';}}
async function discover(){const seq=entryRequestId;try{const value=await call('ai_loop.dashboard',chat?{session:chat.id}:entryInput??{});if(seq===entryRequestId)acceptInitial(value);}catch(error){if(seq===entryRequestId)$('note').textContent=error.message;}}
async function init(){try{let connected=false;try{await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'AI Loop 工作流',version:'4.6.3'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});connected=true;bridgeConnected=true;}catch(error){if(!app?.callTool)throw error;}if(connected)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(app?.toolOutput){const initial=structured(app.toolOutput);if(initial?.workspaces)acceptInitial(initial,true);}const input=entryInput??contextArgs(app?.toolInput);if(input)await acceptToolInput(input);else if(!workspacesLoaded){const seq=entryRequestId,value=await call('ai_loop.dashboard');if(seq===entryRequestId)acceptInitial(value,true);}}catch(error){$('note').textContent=error.message;}}
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{const page=button.dataset.page;document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));$('settings-page').hidden=page!=='settings';$('dashboard-page').hidden=page!=='dashboard';}));
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{activeView=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));if(payload)render(payload);}));
$('workspace').addEventListener('change',()=>{savedState();message('');loadSettings(selected()?.id?{workspace_id:selected().id}:{workspace_root:rootFor()}).catch(error=>message(error.message,true));return loadRuns();});
$('settings').addEventListener('change',event=>{const input=event.target,name=input.dataset?.field;if(!name)return;const schema=settingsData?.schema?.properties?.[name];const value=schema?.type==='boolean'?input.checked:schema?.type==='integer'?Number(input.value):input.value;loadSettings({[name]:value}).catch(error=>message(error.message,true));});
$('run').addEventListener('change',()=>refresh());$('refresh').addEventListener('click',()=>refresh());$('more').addEventListener('click',()=>refresh(true));$('discover').addEventListener('click',discover);$('save').addEventListener('click',()=>saveAction('apply'));$('discard').addEventListener('click',()=>saveAction('discard'));$('inherit').addEventListener('click',()=>saveAction('reset_project'));
$('view').addEventListener('click',async event=>{handleGraphClick(event);const button=event.target.closest?.('button[data-session]');if(!button?.dataset.session)return;try{const result=await request('ui/open-link',{url:'codex://threads/'+encodeURIComponent(button.dataset.session)});if(result===false||result?.isError||result?.ok===false)throw Error('宿主拒绝打开此聊天');message('已向宿主请求打开子代理聊天。');}catch(error){message('宿主未能打开聊天：'+error.message,true);}});

function handleGraphClick(event){const button=event.target.closest?.('button')??event.target.closest?.('[data-node]');if(!button?.dataset||!['graphAction','node','collapse'].some(key=>Object.hasOwn(button.dataset,key)))return;const section=event.target.closest?.('[data-graph-key]');if(!section?.dataset?.graphKey)return;const key=section.dataset.graphKey,state=graphState(key),record=graphData.get(key);if(!record)return;const action=button.dataset.graphAction;
 if(button.dataset.node){state.selected=button.dataset.node;updateGraph(section);return;}
 if(button.dataset.collapse){const id=button.dataset.collapse;state.collapsed=state.collapsed.includes(id)?state.collapsed.filter(value=>value!==id):[...state.collapsed,id];updateGraph(section);return;}
 if(!action)return;const port=section.querySelector('.graph-port'),before=state.zoom;
 if(action==='expand')state.collapsed=[];else if(action==='collapse')state.collapsed=(record.data?.run?.tasks??[]).map(task=>task.id);else if(action==='reset'){state.zoom=1;state.left=0;state.top=0;if(port){port.scrollLeft=0;port.scrollTop=0;}}else if(action==='fit')state.zoom=Math.min(1,Math.max(.35,(port?.clientWidth??400)/record.graph.width));else state.zoom=Math.min(1.5,Math.max(.35,Math.round((state.zoom+(action==='in' ? .1 : -.1))*100)/100));
 if(port&&state.zoom!==before&&!['reset','fit'].includes(action)){port.scrollLeft=(port.scrollLeft+(port.clientWidth??0)/2)*state.zoom/before-(port.clientWidth??0)/2;port.scrollTop=(port.scrollTop+(port.clientHeight??0)/2)*state.zoom/before-(port.clientHeight??0)/2;}
 if(action==='fit'&&port){port.scrollLeft=Math.max(0,(record.graph.width*state.zoom-port.clientWidth)/2);port.scrollTop=0;}
 updateGraph(section);
}
$('view').addEventListener('keydown',event=>{const node=event.target.closest?.('[data-node]');if(node&&event.target===node&&['Enter',' '].includes(event.key)){event.preventDefault();handleGraphClick(event);return;}const port=event.target.closest?.('.graph-port');if(!port||event.target!==port)return;const section=port.closest?.('[data-graph-key]');if(!section)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();if(event.key==='ArrowLeft')port.scrollLeft-=48;if(event.key==='ArrowRight')port.scrollLeft+=48;if(event.key==='ArrowUp')port.scrollTop-=48;if(event.key==='ArrowDown')port.scrollTop+=48;rememberGraphPositions();}else if(['+','=','-'].includes(event.key)){event.preventDefault();const state=graphState(section.dataset.graphKey);state.zoom=Math.max(.35,Math.min(1.5,Math.round((state.zoom+(event.key==='-'?-.1:.1))*100)/100));updateGraph(section);}});
$('view').addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest?.('button,a,input,select,summary,[data-node]'))return;const port=event.target.closest?.('.graph-port');if(!port)return;graphDrag={port,x:event.clientX,y:event.clientY,left:port.scrollLeft,top:port.scrollTop};port.setPointerCapture?.(event.pointerId);});
$('view').addEventListener('pointermove',event=>{if(!graphDrag)return;graphDrag.port.scrollLeft=graphDrag.left+graphDrag.x-event.clientX;graphDrag.port.scrollTop=graphDrag.top+graphDrag.y-event.clientY;});
$('view').addEventListener('pointerup',()=>{graphDrag=null;rememberGraphPositions();});$('view').addEventListener('pointercancel',()=>{graphDrag=null;});
window.addEventListener('focus',event=>{if(event.type==='focus'&&workspacesLoaded&&!busy)discover();});document.addEventListener?.('visibilitychange',()=>{if(document.visibilityState==='visible'&&workspacesLoaded&&!busy)discover();});
if(typeof setInterval==='function'){const timer=setInterval(()=>{if(document.visibilityState==='visible'&&workspacesLoaded&&!busy)discover();},15000);window.addEventListener('pagehide',()=>clearInterval(timer));}init();
</script></body></html>
